<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Freelancer Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--primary:#6366f1;--primary-dark:#4f46e5;--dark:#0f172a;--gray:#64748b;--light:#f8fafc;--border:#e2e8f0}
    body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--dark);background:var(--light);min-height:100vh;display:flex;flex-direction:column}
    .header{background:white;height:72px;border-bottom:1px solid var(--border)}
    .nav-wrap{display:flex;justify-content:space-between;align-items:center;height:100%;max-width:1280px;margin:0 auto;padding:0 24px}
    .logo{display:flex;align-items:center;gap:10px;text-decoration:none}
    .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:20px}
    .logo-text{font-size:24px;font-weight:800;color:var(--dark);letter-spacing:-0.5px}
    .logo-text span{color:var(--primary)}
    .join{text-decoration:none;color:var(--primary);font-weight:700;border:2px solid var(--primary);padding:8px 20px;border-radius:12px;font-size:15px}
    .auth-page{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
    .auth-box{background:white;padding:48px;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,0.08);width:100%;max-width:480px;border:1px solid var(--border)}
    .auth-box h2{font-size:32px;font-weight:800;margin-bottom:12px;letter-spacing:-1px}
    .subtitle{color:var(--gray);margin-bottom:36px;font-size:16px}
    .auth-form label{display:block;font-weight:600;margin-bottom:10px;margin-top:24px;font-size:15px}
    .auth-form input{width:100%;padding:14px 18px;border:2px solid var(--border);border-radius:12px;font-size:16px;font-family:inherit;transition:.2s}
    .auth-form input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,0.1)}
    .form-row{display:flex;justify-content:space-between;align-items:center;margin:24px 0;font-size:15px}
    .checkbox{display:flex;align-items:center;gap:10px;color:var(--gray)}
    .checkbox input{width:20px;height:20px}
    .forgot{color:var(--primary);text-decoration:none;font-weight:600}
    .btn-primary{width:100%;padding:16px;background:var(--primary);color:white;border:none;border-radius:12px;font-weight:700;font-size:17px;cursor:pointer;margin-top:12px;text-decoration:none;display:block;text-align:center;transition:.2s}
    .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px)}
    .divider{display:flex;align-items:center;text-align:center;margin:28px 0;color:var(--gray);font-size:14px}
    .divider::before,.divider::after{content:'';flex:1;border-bottom:1px solid var(--border)}
    .divider span{padding:0 16px}
    .social-btn{width:100%;padding:14px;border:2px solid var(--border);background:white;border-radius:12px;font-weight:600;font-size:16px;cursor:pointer;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:var(--dark)}
    .social-btn:hover{border-color:var(--primary)}
    .auth-switch{text-align:center;margin-top:32px;color:var(--gray);font-size:15px}
    .auth-switch a{color:var(--primary);font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <header class="header">
    <div class="nav-wrap">
      <a href="index.html" class="logo">
        <div class="logo-icon">F</div>
        <div class="logo-text">Freelancer<span>Hub</span></div>
      </a>
      <a href="signup.html" class="join">Sign Up</a>
    </div>
  </header>

  <section class="auth-page">
    <div class="auth-box">
      <h2>Welcome back</h2>
      <p class="subtitle">Log in to continue to your account</p>
      <form class="auth-form" action="dashboard.html">
        <label>Email address</label>
        <input type="email" placeholder="you@example.com" required>
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
        <div class="form-row">
          <label class="checkbox"><input type="checkbox"> Remember me</label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>
        <button type="submit" class="btn-primary">Log In</button>
      </form>
      <div class="divider"><span>OR</span></div>
      <a href="dashboard.html" class="social-btn">Continue with Google</a>
      <a href="dashboard.html" class="social-btn">Continue with GitHub</a>
      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up for free</a></p>
    </div>
  </section>
</body>
</html>
